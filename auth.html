<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Get Started — Fight the Urge</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="supabase.js" defer></script>
    <script src="auth.js" defer></script>
</head>

<body>

    <div class="container">

        <div class="hero">

            <h1>Get started</h1>

            <p class="intro">
                Create an account to access the full Fight the Urge experience.
            </p>

            <p class="description">
                Your account keeps your progress, favorites, ratings, and other
                personal information separate from everyone else's.
            </p>

        </div>


        <div class="auth-card">

            <h2>Create an account</h2>

            <form id="signup-form">

                <label for="signup-email">Email</label>
                <input
                    type="email"
                    id="signup-email"
                    required
                    autocomplete="email"
                >

                <label for="signup-password">Password</label>
                <input
                    type="password"
                    id="signup-password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >

                <button type="submit">
                    Create account
                </button>

            </form>


            <div class="divider">
                <span>Already have an account?</span>
            </div>


            <form id="login-form">

                <label for="login-email">Email</label>
                <input
                    type="email"
                    id="login-email"
                    required
                    autocomplete="email"
                >

                <label for="login-password">Password</label>
                <input
                    type="password"
                    id="login-password"
                    required
                    autocomplete="current-password"
                >

                <button type="submit">
                    Log in
                </button>

            </form>


            <p id="auth-message"></p>

        </div>


        <p class="footer-note">
            Your account is private. You can leave whenever you want.
        </p>

    </div>

</body>
</html>
